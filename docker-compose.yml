services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeguard
      POSTGRES_USER: codeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeguard}
    ports:
      - "5432:5432"
    volumes:
      - codeguard-postgres-enterprise-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      # 容器运行时使用 PostgreSQL；本地直接 mvn spring-boot:run 时仍默认使用 H2。
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codeguard
      SPRING_DATASOURCE_USERNAME: codeguard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-codeguard}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CODEGUARD_TOKEN_SECRET: ${CODEGUARD_TOKEN_SECRET:-codeguard-demo-token-secret-change-before-production}
      CODEGUARD_TOKEN_TTL_MINUTES: ${CODEGUARD_TOKEN_TTL_MINUTES:-480}
      CODEGUARD_LLM_PROVIDER: ${CODEGUARD_LLM_PROVIDER:-deepseek}
      CODEGUARD_LLM_API_KEY: ${CODEGUARD_LLM_API_KEY:-}
      CODEGUARD_LLM_BASE_URL: ${CODEGUARD_LLM_BASE_URL:-}
      CODEGUARD_LLM_MODEL: ${CODEGUARD_LLM_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SERVER_PORT: 8080
    ports:
      # 宿主机用 18080，避免和本地直接启动的 Spring Boot 8080 冲突。
      - "18080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  codeguard-postgres-enterprise-data:
